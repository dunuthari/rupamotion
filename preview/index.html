<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rupa Motion · Panel UI preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Design system tokens (same values as the After Effects panel) ===== */
  :root {
    color-scheme: light;
    --page: #EFF0F2;
    --surface: #F7F8FA;
    --card: #FFFFFF;
    --hairline: #E2E4E8;
    --text: #111316;
    --label: #5F6368;
    --hint: #94979C;
    --primary: #0A6CFF;
    --primary-press: #0058D6;
    --on-primary: #FFFFFF;
    --tint: #E8F1FF;
    --field: #FFFFFF;
    --shadow: 0 2px 0 rgba(15, 23, 41, .05), 0 12px 32px -18px rgba(15, 23, 41, .25);
    --radius-outer: 18px;
    --radius-inner: 14px;
    --font: "Google Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #1C1D20;
    --surface: #232428;
    --card: #2B2D31;
    --hairline: #3C3E43;
    --text: #F1F2F4;
    --label: #BEC0C4;
    --hint: #90939A;
    --primary: #0A6CFF;
    --primary-press: #3D8BFF;
    --on-primary: #FFFFFF;
    --tint: #1E3357;
    --field: #1F2024;
    --shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 12px 32px -18px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 32px 16px 64px;
  }

  .stage { width: 100%; max-width: 392px; }
  .note { color: var(--hint); font-size: 12px; text-align: center; margin: 14px 0 0; }

  /* ===== Panel ===== */
  .panel {
    background: var(--page);
    border: 1px solid var(--hairline);
    border-radius: 22px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .head { display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--primary); color: var(--on-primary);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .head .sub { margin-left: auto; color: var(--hint); font-size: 12px; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-outer);
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card > h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
  .card .card { background: var(--card); border-radius: var(--radius-inner); padding: 12px; gap: 7px; box-shadow: 0 1px 0 rgba(15, 23, 41, .04); }
  .card .card > h3 { margin: 0 0 2px; font-size: 12px; font-weight: 700; }

  /* Icon tab bar */
  .nav { padding: 6px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .tab {
    appearance: none; border: 1px solid transparent; background: transparent;
    color: var(--hint); font: inherit; font-size: 10.5px;
    border-radius: 14px; padding: 8px 2px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab svg .dot { fill: currentColor; stroke: none; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--card); border-color: var(--hairline); font-weight: 700; }
  .tab[aria-selected="true"] svg { stroke-width: 2; }

  /* Feature chips */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chips[hidden] { display: none; }
  .chip {
    appearance: none; font: inherit; font-size: 12px; cursor: pointer;
    height: 28px; padding: 0 10px; border-radius: 999px;
    border: 1px solid var(--hairline); background: var(--card); color: var(--label);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip[aria-selected="true"] { background: var(--tint); border-color: var(--tint); color: var(--primary); font-weight: 700; }

  /* Form rows */
  .row { display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 6px; min-height: 30px; }
  .row > label, .row > .lbl { color: var(--label); font-size: 12px; }
  .row .ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
  input[type="text"], select {
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--field); border: 1px solid var(--hairline); border-radius: 10px;
    height: 28px; padding: 0 9px; min-width: 0;
  }
  input[type="text"] { width: 72px; }
  input.wide { width: 100%; }
  select { padding-right: 6px; max-width: 100%; }
  .hint { color: var(--hint); font-size: 11.5px; margin: 0; }

  /* Toggle switch */
  .toggle {
    appearance: none; border: 0; background: none; padding: 0; font: inherit; font-size: 12px;
    color: var(--text); display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; min-height: 24px;
  }
  .toggle .track { width: 32px; height: 18px; border-radius: 999px; background: var(--hairline); position: relative; flex: none; transition: background .15s; }
  .toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle[aria-checked="true"] .track { background: var(--primary); }
  .toggle[aria-checked="true"] .track::after { transform: translateX(14px); }

  /* Pill buttons */
  .btn {
    appearance: none; font: inherit; font-size: 12px; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: 999px; width: 100%;
    border: 1px solid var(--hairline); background: var(--card); color: var(--text);
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
  .btn.primary:active { background: var(--primary-press); }
  .btn { transition: background .08s, border-color .08s, transform .08s; }
  .btn:not(.primary):active { background: var(--hairline); border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); transform: translateY(1px); }
  .btn.primary:active { transform: translateY(1px); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns.four { grid-template-columns: repeat(4, 1fr); }

  
  .swatch.big { width: 64px; height: 40px; cursor: pointer; padding: 0; }
  .swatch { width: 24px; height: 20px; border-radius: 6px; border: 1px solid var(--hairline); flex: none; }
  input[type="color"] { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  /* Color picker (mirrors the panel's dark picker) */
  .cp-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .cp { background: #1C1D20; color: #F1F2F4; border: 1px solid #3C3E43; border-radius: 12px; padding: 14px; display: flex; gap: 12px; flex-wrap: wrap; max-width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .cp h2 { flex-basis: 100%; margin: 0; font-size: 13px; font-weight: 700; }
  .cp canvas { display: block; cursor: crosshair; border-radius: 2px; touch-action: none; }
  .cp-side { display: flex; flex-direction: column; gap: 6px; width: 120px; }
  .cp-cmp { height: 44px; border: 1px solid #3C3E43; display: grid; grid-template-rows: 1fr 1fr; }
  .cp-f { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #BEC0C4; }
  .cp-f span { width: 14px; }
  .cp-f input { width: 100%; min-width: 0; height: 24px; background: #1F2024; color: #F1F2F4; border: 1px solid #3C3E43; border-radius: 6px; padding: 0 6px; font: inherit; }
  .cp-btns { display: flex; gap: 6px; margin-top: 4px; }
  .cp-btns .btn { height: 30px; padding: 0; background: #2B2D31; border-color: #3C3E43; color: #F1F2F4; }
  .cp-btns .btn.primary { background: #0A6CFF; border-color: #0A6CFF; color: #fff; }

  /* Flow easing group */
  .flow-graph { display: block; width: 100%; max-width: 300px; margin: 0 auto; aspect-ratio: 300 / 252; touch-action: none; cursor: crosshair; border-radius: 10px; }
  .flow-vals { display: flex; gap: 4px; align-items: center; }
  .flow-vals input { width: 44px; min-width: 0; padding: 0 4px; text-align: center; }
  .flow-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .flow-modes .btn { height: 28px; }
  .flow-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .flow-tile { padding: 4px 0 3px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--card); color: var(--hint); font: 9px/1.1 var(--font); display: grid; justify-items: center; gap: 1px; cursor: pointer; min-width: 0; }
  .flow-tile canvas { width: 100%; height: 38px; display: block; }
  .flow-tile[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
  .flow-tile:active { transform: translateY(1px); border-color: var(--primary); }
  .pick { width: auto; height: 26px; padding: 0 10px; flex: none; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--page); font-size: 12px;
    padding: 10px 16px; border-radius: 999px; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .toast, .toggle .track, .toggle .track::after { transition: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <main class="panel" aria-label="Rupa Motion panel">
    <header class="head">
      <div class="logo" aria-hidden="true">R</div>
      <div class="title">Rupa Motion</div>
      <div class="sub">Toolkit</div>
    </header>
    <nav class="card nav" id="nav" role="tablist" aria-label="Groups"></nav>
    <div class="chips" id="chips" role="tablist" aria-label="Features" hidden></div>
    <section class="card" id="view" aria-live="polite"></section>
  </main>
  <p class="note">UI preview of the After Effects panel. Buttons show what they'd do; the real actions run inside After Effects.</p>
</div>
<div class="toast" id="toast" role="status"></div>

    if (t === "size") {
      var w = el("input", { type: "text", value: spec[2], "aria-label": "Width" });
      var h = el("input", { type: "text", value: spec[3], "aria-label": "Height" });
      return row(spec[1], el("div", { class: "ctl" }, [w, h]));
    }
    if (t === "bounce") return bounceControl(spec[1]);
    if (t === "flow") return flowControl();
    if (t === "theme") return themeControl();
    return null;
  }

  // ---------- navigation ----------
  var nav = document.getElementById("nav"), chips = document.getElementById("chips"), view = document.getElementById("view");

  GROUPS.forEach(function (g) {
    nav.appendChild(el("button", {
      class: "tab", type: "button", role: "tab", "data-group": g, title: g, "aria-selected": "false",
      html: '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[g] + "</svg><span>" + (NAV_LABELS[g] || g) + "</span>",
      onclick: function () { pick(g); }
    }));
  });

  function featuresOf(g) { return FEATURES.filter(function (f) { return f.group === g; }); }

  function showFeature(f) {
    view.innerHTML = "";
    view.appendChild(el("h2", { text: f.name }));
    f.ui.forEach(function (s) { var n = render(s); if (n) view.appendChild(n); });
    save("feature", f.name);
  }

  function pick(g, featName) {
    var list = featuresOf(g);
    var f = list.filter(function (x) { return x.name === featName; })[0] || list[0];
    [].forEach.call(nav.children, function (t) { t.setAttribute("aria-selected", String(t.dataset.group === g)); });
    chips.innerHTML = "";
    chips.hidden = list.length <= 1;
    if (list.length > 1) {
      list.forEach(function (x) {
        chips.appendChild(el("button", {
          class: "chip", type: "button", role: "tab", text: x.name, title: x.name, "aria-selected": String(x === f),
          onclick: function (ev) {
            [].forEach.call(chips.children, function (c) { c.setAttribute("aria-selected", "false"); });
            ev.currentTarget.setAttribute("aria-selected", "true");
            showFeature(x);
          }
        }));
      });
    }
    showFeature(f);
    save("group", g);
  }

  var lastGroup = load("group", GROUPS[0]);
  pick(GROUPS.indexOf(lastGroup) >= 0 ? lastGroup : GROUPS[0], load("feature", ""));
})();
</script>
</body>
</html>
